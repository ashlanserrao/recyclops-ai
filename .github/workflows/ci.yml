# Every push to main and every pull request: backend lint, types and tests, then the frontend's
# lint, typecheck, tests and build, then the end-to-end test against the built app.
# No API key is used; backend tests block the network.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check
      - run: mypy
      - run: pytest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
      # The runner's own Chrome; the app is served by uvicorn from the Python setup above.
      - name: End-to-end
        working-directory: frontend
        run: npm run test:e2e
